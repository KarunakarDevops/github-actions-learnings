# https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-azure
name: 092-deploy-azure-resource
on:
  workflow_dispatch:
    inputs:
      dev:
        description: "Deploy dev environment"
        required: false
        default: true
        type: boolean
      test:
        description: "Deploy test environment"
        required: false
        default: false
        type: boolean
      prod:
        description: "Deploy prod environment"
        required: false
        default: false
        type: boolean

jobs:
  validate-selection:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure at least one environment is selected
        run: |
          if [ "${{ inputs.dev }}" != 'true' ] && [ "${{ inputs.test }}" != 'true' ] && [ "${{ inputs.prod }}" != 'true' ]; then
            echo 'Error: select at least one of dev, test, or prod.'
            exit 1
          fi

  prepare-dev:
    if: ${{ inputs.dev }}
    uses: ./.github/workflows/092-prepare-infra.yml
    needs: validate-selection
    with:
      environment: dev
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  deploy-dev:
    if: ${{ inputs.dev }}
    needs: prepare-dev
    uses: ./.github/workflows/092-deploy-infra.yml
    with:
      environment: dev
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  prepare-test:
    if: ${{ inputs.test }}
    uses: ./.github/workflows/092-prepare-infra.yml
    needs: validate-selection
    with:
      environment: test
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  deploy-test:
    if: ${{ inputs.test }}
    needs: prepare-test
    uses: ./.github/workflows/092-deploy-infra.yml
    with:
      environment: test
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  prepare-prod:
    if: ${{ inputs.prod }}
    uses: ./.github/workflows/092-prepare-infra.yml
    needs: validate-selection
    with:
      environment: prod
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

  deploy-prod:
    if: ${{ inputs.prod }}
    needs: prepare-prod
    uses: ./.github/workflows/092-deploy-infra.yml
    with:
      environment: prod
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
